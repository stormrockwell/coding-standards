name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  sniff-tests:
    name: Sniff tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version composer.json allows, and the newest in common use.
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer test

  lint-php-fixtures:
    name: Lint PHP fixtures (base and WordPress layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer lint:fixtures

  lint-js-fixtures:
    name: Lint JS and CSS fixtures (base and WordPress layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint:fixtures
